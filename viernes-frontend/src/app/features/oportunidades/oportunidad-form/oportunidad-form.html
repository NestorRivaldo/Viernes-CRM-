<div class="form-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ isEdit ? 'Editar Oportunidad' : 'Nueva Oportunidad' }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="guardar()">
        
        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Nombre Oportunidad</mat-label>
            <input matInput formControlName="nombre" required>
          </mat-form-field>
  
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Cliente</mat-label>
            <input matInput formControlName="clienteNombre">
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Valor</mat-label>
            <input matInput formControlName="valor" type="number" min="0">
          </mat-form-field>
  
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Probabilidad (%)</mat-label>
            <input matInput formControlName="probabilidad" type="number" min="0" max="100">
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Etapa</mat-label>
            <mat-select formControlName="etapa">
              <mat-option *ngFor="let et of etapas" [value]="et">{{ et }}</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Responsable</mat-label>
            <input matInput formControlName="responsable">
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Fecha Cierre</mat-label>
            <input matInput formControlName="fechaCierre" type="date">
          </mat-form-field>
        </div>

        <div class="form-actions">
          <button mat-button type="button" routerLink="/oportunidades">Cancelar</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || loading">
            {{ loading ? 'Guardando...' : 'Guardar' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>

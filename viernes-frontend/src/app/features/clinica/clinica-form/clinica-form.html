<div class="clinica-form-card">
  <div class="form-header">
    <h3>{{ titulo }}</h3>
    <button type="button" class="btn-icon-close" (click)="cancelar()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  @if (serverError) {
    <div class="form-alert error">
      <mat-icon>error_outline</mat-icon>
      <span>{{ serverError }}</span>
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()" class="form-body">
    <!-- RUC -->
    <div class="form-row">
      <label for="ruc" class="form-label">RUC <span class="req">*</span></label>
      <div class="input-with-error">
        <input
          id="ruc"
          type="text"
          formControlName="ruc"
          maxlength="11"
          placeholder="Ej: 20135792468"
          class="form-control"
          [class.is-invalid]="tieneErrorRuc()"
        />
        @if (tieneErrorRuc()) {
          <span class="inline-error">
            <mat-icon>close</mat-icon> El RUC debe tener 11 dígitos
          </span>
        }
      </div>
    </div>

    <!-- Razón social -->
    <div class="form-row">
      <label for="razonSocial" class="form-label">Razón social <span class="req">*</span></label>
      <div class="input-with-error">
        <input
          id="razonSocial"
          type="text"
          formControlName="razonSocial"
          placeholder="Ej: Clínica Altiplano SAC"
          class="form-control"
          [class.is-invalid]="tieneErrorRazonSocial()"
        />
        @if (tieneErrorRazonSocial()) {
          <span class="inline-error">
            <mat-icon>close</mat-icon> La razón social es obligatoria
          </span>
        }
      </div>
    </div>

    <!-- Teléfono -->
    <div class="form-row">
      <label for="telefono" class="form-label">Teléfono</label>
      <div class="input-with-error">
        <input
          id="telefono"
          type="text"
          formControlName="telefono"
          placeholder="Ej: 951357924"
          class="form-control"
        />
      </div>
    </div>

    <!-- Activa -->
    <div class="form-row checkbox-row">
      <label class="form-label">Activa</label>
      <div class="checkbox-wrapper">
        <input
          id="activo"
          type="checkbox"
          formControlName="activo"
          class="form-checkbox"
        />
        <label for="activo" class="checkbox-label">Clínica operativa</label>
      </div>
    </div>

    <!-- Botones de Acción -->
    <div class="form-actions">
      <button type="button" class="btn-secondary" (click)="cancelar()" [disabled]="guardando">
        Cancelar
      </button>
      <button type="submit" class="btn-primary" [disabled]="guardando">
        @if (guardando) {
          <span>Guardando...</span>
        } @else {
          <span>Guardar</span>
        }
      </button>
    </div>
  </form>
</div>

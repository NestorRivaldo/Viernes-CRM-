<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Iniciar sesión en Viernes</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo electrónico</mat-label>
          <input matInput formControlName="correo" type="email" required>
        </mat-form-field>
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput formControlName="password" type="password" required>
        </mat-form-field>

        <div *ngIf="error" class="error-message">
          {{ error }}
        </div>

        <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid || loading" class="full-width">
          {{ loading ? 'Cargando...' : 'Iniciar sesión' }}
        </button>

        <button mat-stroked-button type="button" class="full-width dev-bypass" (click)="entrarSinLogin()">
          Entrar sin login (modo demo)
        </button>

        <div style="margin-top: 16px; font-size: 12px; color: #6b7280; text-align: center;">
          Usuario: <strong>admin@viernes.com</strong> | Contraseña: <strong>Admin12345</strong>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>

<div class="login-page">
  <div class="login-glow" aria-hidden="true"></div>

  <main class="login-card">
    <header class="login-header">
      <div class="brand-badge">
        <div class="brand-logo">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M6 8L16 26L26 8" stroke="url(#vBrandGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="vBrandGrad" x1="6" y1="8" x2="26" y2="26" gradientUnits="userSpaceOnUse">
                <stop stop-color="#38BDF8"/>
                <stop offset="0.5" stop-color="#3B82F6"/>
                <stop offset="1" stop-color="#818CF8"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="brand-name">Viernes <span class="brand-tag">CRM</span></span>
      </div>

      <h1>Accede a tu espacio de trabajo</h1>
      <p class="login-subtitle">
        Gestiona tus clientes, oportunidades y actividades comerciales en un solo lugar.
      </p>
    </header>

    @if (error()) {
      <div class="login-error" role="alert">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>{{ error() }}</span>
      </div>
    }

    <div class="login-action-box">
      <button
        type="button"
        class="login-btn"
        [disabled]="loading()"
        (click)="entrar()"
      >
        @if (loading()) {
          <span class="spinner" aria-hidden="true"></span>
          <span>Conectando con Keycloak...</span>
        } @else {
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3 4.5 6v5.2c0 4.6 3.1 8.9 7.5 9.8 4.4-.9 7.5-5.2 7.5-9.8V6L12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="m9.2 12 1.9 1.9 3.8-3.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Continuar con Keycloak</span>
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        }
      </button>
    </div>

    <footer class="login-footer">
      <div class="security-meta">
        <span class="status-dot"></span>
        <span>Autenticación segura con Keycloak (OIDC)</span>
      </div>
      <p class="copyright">© {{ year }} Viernes CRM · V1.0</p>
    </footer>
  </main>
</div>

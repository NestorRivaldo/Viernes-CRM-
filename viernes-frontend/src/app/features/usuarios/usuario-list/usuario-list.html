<div class="list-container">
  <div class="header-actions">
    <h2>Usuarios</h2>
    <button mat-raised-button color="primary" routerLink="/usuarios/nuevo">
      <mat-icon>add</mat-icon> Nuevo Usuario
    </button>
  </div>

  @if (loading()) {
    <div class="loading-state">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  }

  @if (error()) {
    <div class="error-message">{{ error() }}</div>
  }

  @if (isEmpty()) {
    <div class="empty-state">
      No hay usuarios registrados.
    </div>
  }

  @if (hasUsuarios()) {
    <table mat-table [dataSource]="usuarios()" class="mat-elevation-z8">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let u"> {{u.id}} </td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let u"> {{u.nombre}} {{u.apellido}} </td>
      </ng-container>

      <ng-container matColumnDef="correo">
        <th mat-header-cell *matHeaderCellDef> Correo </th>
        <td mat-cell *matCellDef="let u"> {{u.correo}} </td>
      </ng-container>

      <ng-container matColumnDef="rol">
        <th mat-header-cell *matHeaderCellDef> Rol </th>
        <td mat-cell *matCellDef="let u"> {{u.rol}} </td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef> Estado </th>
        <td mat-cell *matCellDef="let u"> {{u.estado}} </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let u">
          <button mat-icon-button color="primary" (click)="editar(u.id)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button [color]="u.estado === 'ACTIVO' ? 'warn' : 'accent'" (click)="cambiarEstado(u)">
            <mat-icon>{{ u.estado === 'ACTIVO' ? 'block' : 'check_circle' }}</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  }
</div>

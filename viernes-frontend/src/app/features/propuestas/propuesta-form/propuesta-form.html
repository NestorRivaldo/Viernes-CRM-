<div class="form-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        {{ isEdit ? 'Editar Propuesta' : 'Nueva Propuesta' }}
        <span *ngIf="isEdit" class="estado-chip">{{ estadoActual }}</span>
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div *ngIf="loading" class="loading-state">Cargando...</div>

      <form [formGroup]="form" (ngSubmit)="guardar()">

        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>ID Oportunidad</mat-label>
            <input matInput type="number" formControlName="idOportunidad" required>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>ID Cliente</mat-label>
            <input matInput type="number" formControlName="idCliente" required>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Nombre del Cliente</mat-label>
            <input matInput formControlName="clienteNombre">
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Responsable</mat-label>
            <input matInput formControlName="responsable">
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Fecha de Emisión</mat-label>
            <input matInput type="date" formControlName="fechaEmision" required>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Fecha de Vencimiento</mat-label>
            <input matInput type="date" formControlName="fechaVencimiento">
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Descuento</mat-label>
            <input matInput type="number" formControlName="descuento" min="0">
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Observaciones</mat-label>
            <textarea matInput formControlName="observaciones" rows="2"></textarea>
          </mat-form-field>
        </div>

        <h3>Detalles</h3>
        <div formArrayName="detalles">
          <div class="detalle-row" *ngFor="let detalle of detalles.controls; let i = index" [formGroupName]="i">
            <mat-form-field appearance="outline" class="detalle-descripcion">
              <mat-label>Descripción</mat-label>
              <input matInput formControlName="descripcion" required>
            </mat-form-field>

            <mat-form-field appearance="outline" class="detalle-num">
              <mat-label>Cantidad</mat-label>
              <input matInput type="number" formControlName="cantidad" required min="1">
            </mat-form-field>

            <mat-form-field appearance="outline" class="detalle-num">
              <mat-label>Precio Unitario</mat-label>
              <input matInput type="number" formControlName="precioUnitario" required min="0">
            </mat-form-field>

            <button mat-icon-button color="warn" type="button" (click)="eliminarDetalle(i)"
                    *ngIf="estadoActual === 'BORRADOR'">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </div>

        <div class="detalle-actions" *ngIf="estadoActual === 'BORRADOR'">
          <button mat-stroked-button type="button" (click)="agregarDetalle()">
            <mat-icon>add</mat-icon> Agregar Detalle
          </button>
        </div>

        <div class="total-row">
          <strong>Total estimado: {{ totalEstimado | currency }}</strong>
        </div>

        <div class="form-actions">
          <button mat-button type="button" routerLink="/propuestas">Volver</button>

          <ng-container *ngIf="isEdit">
            <button mat-raised-button color="accent" type="button" (click)="cambiarEstado('enviar')"
                    *ngIf="estadoActual === 'BORRADOR'" [disabled]="loading">
              Enviar
            </button>
            <button mat-raised-button color="primary" type="button" (click)="cambiarEstado('aprobar')"
                    *ngIf="estadoActual === 'ENVIADA'" [disabled]="loading">
              Aprobar
            </button>
            <button mat-raised-button color="warn" type="button" (click)="cambiarEstado('rechazar')"
                    *ngIf="estadoActual === 'ENVIADA'" [disabled]="loading">
              Rechazar
            </button>
            <button mat-button color="warn" type="button" (click)="cambiarEstado('cancelar')"
                    *ngIf="estadoActual === 'BORRADOR' || estadoActual === 'ENVIADA'" [disabled]="loading">
              Cancelar Propuesta
            </button>
          </ng-container>

          <button mat-raised-button color="primary" type="submit"
                  *ngIf="estadoActual === 'BORRADOR'" [disabled]="form.invalid || loading">
            {{ loading ? 'Guardando...' : 'Guardar' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>

<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="361px" preserveAspectRatio="none" style="width:1431px;height:361px;background:#FFFFFF;" version="1.1" viewBox="0 0 1431 361" width="1431px" zoomAndPan="magnify"><title>06b estado lead &#8212; comportamiento implementado</title><defs/><g><g class="title" data-source-line="5"><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="336.6563" x="539.6719" y="25.1074">06b estado lead &#8212; comportamiento implementado</text></g><!--cluster R--><g class="cluster" data-qualified-name="R" data-source-line="6" id="ent0002"><path d="M26.5,122.6211 L964.5,122.6211 A12.5,12.5 0 0 1 977,135.1211 L977,144.9121 L14,144.9121 L14,135.1211 A12.5,12.5 0 0 1 26.5,122.6211" fill="#F1F1F1"/><rect fill="none" height="216" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="963" x="14" y="122.6211"/><line style="stroke:#181818;stroke-width:0.5;" x1="14" x2="977" y1="144.9121" y2="144.9121"/><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="102.1909" x="444.4045" y="136.6494">Registro existente</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="19" id="ent0007"><ellipse cx="961" cy="61.6211" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN2" data-source-line="21" id="ent0003"><path d="M985,257.6211 L985,354.0762 L1424.6597,354.0762 L1424.6597,267.6211 L1414.6597,257.6211 L985,257.6211" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1414.6597,257.6211 L1414.6597,267.6211 L1424.6597,267.6211 L1414.6597,257.6211" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="334.9277" x="991" y="276.6494">ANY resume el estado de origen: no es un valor persistido.</text><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="418.6597" x="991" y="293.9404">Se permite cualquier origen &#8594; cualquier destino v&#225;lido, incluso el mismo.</text><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="307.8359" x="991" y="311.2314">No se comprueba secuencia ni se bloquea reapertura.</text><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="203.1885" x="991" y="328.5225">CONVERTIDO no crea oportunidad.</text><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="346.6011" x="991" y="345.8135">Las acciones residen en el servicio; no hay motor de estados.</text></g><g class="entity" data-qualified-name="R.ANY" id="ent0003"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="201.7397" x="304" y="150.6211"/><line style="stroke:#181818;stroke-width:0.5;" x1="304" x2="505.7397" y1="177.9121" y2="177.9121"/><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="181.7397" x="314" y="169.6494">Cualquier valor v&#225;lido del enum</text></g><g class="entity" data-qualified-name="R.E0" id="ent0004"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="63.1069" x="22.5" y="280.6211"/><line style="stroke:#181818;stroke-width:0.5;" x1="22.5" x2="85.6069" y1="307.9121" y2="307.9121"/><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="43.1069" x="32.5" y="299.6494">NUEVO</text></g><g class="entity" data-qualified-name="R.E1" id="ent0005"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="104.9316" x="149.5" y="280.6211"/><line style="stroke:#181818;stroke-width:0.5;" x1="149.5" x2="254.4316" y1="307.9121" y2="307.91
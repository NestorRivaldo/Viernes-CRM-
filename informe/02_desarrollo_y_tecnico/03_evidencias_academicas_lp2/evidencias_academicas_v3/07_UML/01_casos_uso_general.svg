6028" cy="831.6211" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M466.6028,839.6211 L466.6028,866.6211 M453.6028,847.6211 L479.6028,847.6211 M466.6028,866.6211 L453.6028,881.6211 M466.6028,866.6211 L479.6028,881.6211" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="55.2056" x="439" y="897.1494">APIsPERU</text></g><g class="entity" data-qualified-name="GMN40" data-source-line="47" id="ent0041"><path d="M6,641.1211 L6,720.2852 A0,0 0 0 0 6,720.2852 L298.0195,720.2852 A0,0 0 0 0 298.0195,720.2852 L298.0195,651.1211 L288.0195,641.1211 L156,641.1211 L152,623.293 L148,641.1211 L6,641.1211 A0,0 0 0 0 6,641.1211" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M288.0195,641.1211 L288.0195,651.1211 L298.0195,651.1211 L288.0195,641.1211" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="271.0195" x="12" y="660.1494">Usuario autenticado resume la regla HTTP final.</text><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="236.3613" x="12" y="677.4404">ADMIN hereda aqu&#237; capacidades de JEFE,</text><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="227.5571" x="12" y="694.7314">no una jerarqu&#237;a declarada en Keycloak.</text><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="266.3667" x="12" y="712.0225">Las reglas de estado siguen aplicando a todos.</text></g><g class="entity" data-qualified-name="GMN43" data-source-line="53" id="ent0044"><path d="M655,43.6211 L655,68.2939 L672.7492,717.8478 L655,76.2939 L655,105.4941 A0,0 0 0 0 655,105.4941 L944.9121,105.4941 A0,0 0 0 0 944.9121,105.4941 L944.9121,53.6211 L934.9121,43.6211 L655,43.6211 A0,0 0 0 0 655,43.6211" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M934.9121,43.6211 L934.9121,53.6211 L944.9121,53.6211 L934.9121,43.6211" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="255.8994" x="661" y="62.6494">Enviar = cambiar estado; no env&#237;o de correo.</text><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="261.6821" x="661" y="79.9404">No se modela conversi&#243;n autom&#225;tica de lead.</text><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="268.9121" x="661" y="97.2314">No se asignan RF/HU originales no localizados.</text></g><!--entity Sesion--><g class="entity" data-qualified-name="Viernes CRM V1.Sesion" data-source-line="17" id="ent0012"><ellipse cx="800.1672" cy="650.7545" fill="#F1F1F1" rx="73.6672" ry="17.1334" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="111.8076" x="744.2634" y="655.9">Iniciar/cerrar sesi&#243;n</text></g><!--entity Lectura--><g class="entity" data-qualified-name="Viernes CRM V1.Lectura" data-source-line="18" id="ent0013"><ellipse cx="799.9822" cy="434.4175" fill="#F1F1F1" rx="141.9822" ry="30.7964" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="230.5342" x="684.7151" y="432.6785">Consultar clientes, leads, oportunidades,</text><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="202.4014" x="698.7815" y="449.9695">propuestas, actividades y cat&#225;logos</text></g><!--entity Clientes--><g class="entity" data-qualified-name="Viernes CRM V1.Clientes" data-source-line="19" id="ent0014"><ellipse cx="800.138" cy="858.4487" fill="#F1F1F1" rx="119.638" ry="26.3276" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="1
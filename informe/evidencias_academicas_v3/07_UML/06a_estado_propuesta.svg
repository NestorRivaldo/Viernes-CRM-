x="354" y="440.0039">CANCELADA</text><g class="start_entity" data-qualified-name=".start." data-source-line="16" id="ent0002"><ellipse cx="501.5" cy="61.6211" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="26" id="ent0010"><ellipse cx="689.5" cy="527.6211" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="689.5" cy="527.6211" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN2" data-source-line="33" id="ent0003"><path d="M667.5,144.6211 L667.5,169.6211 L540.7383,173.6211 L667.5,177.6211 L667.5,202.5039 A0,0 0 0 0 667.5,202.5039 L909.9434,202.5039 A0,0 0 0 0 909.9434,202.5039 L909.9434,154.6211 L899.9434,144.6211 L667.5,144.6211 A0,0 0 0 0 667.5,144.6211" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M899.9434,144.6211 L899.9434,154.6211 L909.9434,154.6211 L899.9434,144.6211" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="221.4434" x="673.5" y="162.5703">Edici&#243;n y eliminaci&#243;n solo en BORRADOR.</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="151.7988" x="673.5" y="178.5313">Eliminar requiere rol ADMIN.</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="177.3809" x="673.5" y="194.4922">El estado no se modifica al editar.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="39" id="ent0006"><path d="M551.5,271.6211 L551.5,304.6211 L533.6289,308.6211 L551.5,312.6211 L551.5,345.4648 A0,0 0 0 0 551.5,345.4648 L801.5254,345.4648 A0,0 0 0 0 801.5254,345.4648 L801.5254,281.6211 L791.5254,271.6211 L551.5,271.6211 A0,0 0 0 0 551.5,271.6211" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M791.5254,271.6211 L791.5254,281.6211 L801.5254,281.6211 L791.5254,271.6211" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="203.6426" x="557.5" y="289.5703">Aprobar, rechazar y cancelar requieren</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="229.0254" x="557.5" y="305.5313">rol ADMIN o JEFE (KeycloakSecurityConfig).</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="186.9375" x="557.5" y="321.4922">Enviar no tiene restricci&#243;n adicional</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="152.9883" x="557.5" y="337.4531">de rol: basta un token v&#225;lido.</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="46" id="ent0009"><path d="M6,491.6211 L6,565.4648 A0,0 0 0 0 6,565.4648 L348.8203,565.4648 A0,0 0 0 0 348.8203,565.4648 L348.8203,501.6211 L338.8203,491.6211 L265.2796,491.6211 L348.9258,453.578 L257.2796,491.6211 L6,491.6211 A0,0 0 0 0 6,491.6211" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M338.8203,491.6211 L338.8203,501.6211 L348.8203,501.6211 L338.8203,491.6211" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="321.8203" x="12" y="509.5703">Estados terminales: APROBADA, RECHAZADA y CANCELADA.</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="243.3984" x="12" y="525.5313">cancelar() rechaza la operaci&#243;n si la propuesta</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="158.332" x="12" y="541.4922">ya est&#225; en un estado terminal.</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="250.3535" x="12" y="557.4531">No existe transici&#243;n de APROBADA a ENVIADA.</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="53" id="ent0012"><path d="M367,499.6211 L367,557.5039 A0,0 0 0 0 367,557.5039 L660.4785,557.5039 A0,0 0 0 0 660.4785,557.5039 L660.4785,509.6211 L650.4785,499.6211 L517.5,499.6211 L513.5,454.6836 L509.5,499.6211 L367,499.6211 A0,0 0 0 0 367,499.6211" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M650.4785,499.6211 L650.4785,509.6211 L660.4785,509.6211 L650.4785,499.6211" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="272.4785" x="373" y="517.5703">APROBADA no genera autom&#225;ticamente una venta,</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="264.2578" x="373" y="533.5313">una oportunidad GANADA ni un asiento contable.</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="215.6309" x="373" y="549.4922">El cierre comercial es una acci&#243;n externa.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" id="lnk3"><polygon fill="#181818" points="501.5,153.379,505.5,144.379,501.5,148.379,497.5,144.379,501.5,153.379" style="stroke:#181818;stroke-width:1;"/><path d="M501.5,75.7722 C501.5,94.0962 501.5,124.792 501.5,147.379" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="11" lengthAdjust="spacing" textLength="30.7173" x="562.437" y="107.4912">crear()</text><text fill="#000000" font-family="'Segoe UI'" font-size="11" lengthAdjust="spacing" textLength="148.5913" x="503.5" y="122.1221">[siempre inicia en BORRADOR]</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk4"><polygon fill="#181818" points="501.5,288.6008,505.5,279.6008,501.5,283.6008,497.5,279.6008,501.5,288.6008" style="stroke:#181818;stroke-width:1;"/><path d="M501.5,193.6768 C501.5,218.96 501.5,257.3353 501.5,282.6008" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="11" lengthAdjust="spacing" textLength="35.9702" x="539.1963" y="234.4912">enviar()</text><text fill="#000000" font-family="'Segoe UI'" font-size="11" lengthAdjust="spacing" textLength="107.3628" x="503.5" y="249.1221">[requiere BORRADOR]</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk5"><polygon fill="#181818" points="506.6462,414.265,507.8877,404.4947,505.2077,409.4763,500.226,406.7963,506.6462,414.265" style="stroke:#181818;stroke-width:1;"/><path d="M500.2078,328.7517 C499.3684,346.4613 498.9958,373.4718 502.5,396.6211 C503.3826,402.452 503.2321,402.8999 504.92,408.5186" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="11" lengthAdjust="spacing" textLength="44.8594" x="562.7361" y="377.4912">aprobar()</text><text fill="#000000" font-family="'Segoe UI'" font-size="11" lengthAdjust="spacing" textLength="161.3315" x="504.5" y="392.1221">[requiere ENVIADA; ADMIN/JEFE]</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk6"><polygon fill="#181818" points="688.8612,414.5596,691.9385,405.2038,688.3598,409.5848,683.9788,406.0061,688.8612,414.5596" style="stroke:#181818;stroke-width:1;"/><path d="M518.6335,328.6403 C525.4335,335.0412 533.7248,341.5776 542.5,345.6211 C593.4771,369.1105 624.7391,327.2628 667.5,363.6211 C682.2515,376.1639 686.6397,392.5201 688.2595,408.5899" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="11" lengthAdjust="spacing" textLength="47.5127" x="745.4094" y="377.4912">rechazar()</text><text fill="#000000" font-family="'Segoe UI'" font-size="11" lengthAdjust="spacing" textLength="161.3315" x="688.5" y="3
server:
  port: 8080

spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: BOM_VENTAS
    password: 123456
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.viernes: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

viernes:
  cors:
    allowed-origins: http://localhost:4200,http://localhost:8080,http://localhost:3000

jwt:
  # Clave en Base64 — 256 bits mínimo para HS256. Generar con: openssl rand -base64 32
  secret: dGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLXZpZXJuZXMtdjEtY3Jt
  expiration: 28800000  # 8 horas en milisegundos

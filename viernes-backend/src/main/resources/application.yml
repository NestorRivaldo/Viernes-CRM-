spring:
  application:
    name: viernes-backend
  profiles:
    active: dev,keycloak

viernes:
  cache:
    # Refresco explicito de los catalogos cacheados (10 minutos).
    refresh-ms: 600000
  documentos:
    # Consultas DNI/RUC por usuario y ventana. Protege la cuota del plan externo.
    rate-limit:
      max-consultas: 20
      ventana-segundos: 60
    apisperu:
      base-url: https://dniruc.apisperu.com/api/v1
      # Configurar por variable de entorno. Nunca versionar el token real.
      token: ${APISPERU_TOKEN:}
      timeout: 5s
